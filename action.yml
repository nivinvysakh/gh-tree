name: "Minecraft Commit Tree"
description: "Renders your GitHub contribution graph as an animated Minecraft Oak Tree with a transparent background."
branding:
  icon: "git-commit"
  color: "green"
inputs:
  github-token:
    description: "GitHub Token or Personal Access Token with read:user scope"
    required: true
  github-login:
    description: "GitHub username whose contributions drive the tree (defaults to repository owner)"
    required: false
  output-path:
    description: "Where to write the generated GIF"
    required: false
    default: "tree.gif"
  markdown-path:
    description: "Path to markdown file to update with the GIF (defaults to README.md, set empty to disable)"
    required: false
    default: "README.md"
  auto-commit:
    description: "Whether to automatically commit and push the generated tree.gif and updated README.md"
    required: false
    default: "true"
  commit-message:
    description: "Commit message when auto-committing"
    required: false
    default: "chore: update commit tree [skip ci]"
  days:
    description: "How many days of history to pull for commit leaves (bucketed into weekly branches)"
    required: false
    default: "140"
  pr-days:
    description: "Recency window in days for flowers (open PRs), red apples (merged PRs), and golden apples (reviews/assignments)"
    required: false
    default: "14"
  frames:
    description: "Number of animation frames in the loop"
    required: false
    default: "20"
  frame-delay-ms:
    description: "Delay per GIF frame in milliseconds"
    required: false
    default: "100"
  width:
    required: false
    default: "460"
  height:
    required: false
    default: "420"
outputs:
  gif-path:
    description: "Absolute path to the generated GIF"
  total-commits:
    description: "Total contributions counted in the date range"
  open-prs:
    description: "Total open pull requests authored by user"
  merged-prs:
    description: "Total merged pull requests"
  assigned-prs:
    description: "Total open pull requests assigned to user"
runs:
  using: "node20"
  main: "dist/index.js"
