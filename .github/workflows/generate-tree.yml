name: Generate Commit Tree

on:
  workflow_dispatch: {} 

permissions:
  contents: write

jobs:
  render-tree:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Build action bundle
        run: npm run build

      - name: Render Minecraft Tree
        uses: ./
        with:
          github-token: ${{ secrets.TREE_PAT || secrets.GITHUB_TOKEN }}
          github-login: ${{ github.repository_owner }}
          output-path: "tree.gif"
          markdown-path: "README.md"
