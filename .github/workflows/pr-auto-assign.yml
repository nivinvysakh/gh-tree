name: PR Auto Assign & Reviewer Bot

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - ready_for_review

permissions:
  pull-requests: write
  issues: write

jobs:
  auto-assign:
    name: Auto Assign Owner
    runs-on: ubuntu-latest
    if: "!github.event.pull_request.draft"
    steps:
      - name: Assign PR to Owner
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pull_number = context.payload.pull_request.number;
            const prAuthor = context.payload.pull_request.user.login;
            const defaultAssignee = 'nivinvysakh';

            // 1. Add Assignee
            try {
              await github.rest.issues.addAssignees({
                owner,
                repo,
                issue_number: pull_number,
                assignees: [defaultAssignee]
              });
              console.log(`Successfully assigned @${defaultAssignee} to PR #${pull_number}`);
            } catch (error) {
              console.error(`Failed to assign @${defaultAssignee}:`, error);
            }

            // 2. Request Review (only if PR author is not the owner)
            if (prAuthor.toLowerCase() !== defaultAssignee.toLowerCase()) {
              try {
                await github.rest.pulls.requestReviewers({
                  owner,
                  repo,
                  pull_number,
                  reviewers: [defaultAssignee]
                });
                console.log(`Successfully requested review from @${defaultAssignee} for PR #${pull_number}`);
              } catch (error) {
                console.error(`Failed to request review from @${defaultAssignee}:`, error);
              }
            }
