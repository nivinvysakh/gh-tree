name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit & E2E tests
        run: npm test

      - name: Build action bundle
        run: npm run build

      - name: Verify dist is up-to-date
        run: |
          git diff --exit-code dist/ || (echo "Error: dist/ is out of sync with src/. Run 'npm run build' and commit changes." && exit 1)
