name: "💡 Feature Request"
description: "Suggest an idea, workflow improvement, or new action capability"
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to improve `gh-tree`? We'd love to hear it! Please share details below.

  - type: textarea
    id: problem-statement
    attributes:
      label: "Problem or Need"
      description: "Is your feature request related to a problem or a missing capability? Please describe."
      placeholder: "e.g., I would like to support committing the output tree to a dedicated branch or repository..."
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: "Proposed Solution"
      description: "A clear and concise description of what you want to happen and how it could work."
      placeholder: "e.g., Add a new action input `target-branch: gh-pages` that commits to the target branch..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "A clear and concise description of any alternative solutions or features you've considered."
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context / References"
      description: "Add any other context, diagrams, or mockups about the feature request here."
    validations:
      required: false

